<!--- This is form html to add new expense
Able to add and delete
Future enhancement: edit expense --->

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add Expense</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="dashboard">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="sidebar-logo">

        </div>

        <h2>Welcome!</h2>

        <nav class="sidebar-menu">

            <a href="/dashboard">
                Dashboard
            </a>

            <a href="/expenses" class="active">
                Transactions
            </a>

            <a href="/budgets">
                Budgets
            </a>

            <a href="/reports">
                Reports
            </a>

            <a href="/savings">
                Savings Goals
            </a>

        </nav>

    </aside>


    <!-- MAIN CONTENT -->
    <main class="main-content">

        <h1 class="page-title">
            Add Expense
        </h1>

        <div class="card expense-form">

            <h2 class="card-title">
                Expense Details
            </h2>

            <form th:action="@{/expenses/save}"
                  th:object="${expense}"
                  method="post">

                <div class="form-group">

                    <label for="amount">
                        Amount
                    </label>

                    <input id="amount"
                           type="number"
                           step="0.01"
                           th:field="*{amount}"
                           placeholder="0.00"
                           required>

                </div>


                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <input id="description"
                           type="text"
                           th:field="*{description}"
                           placeholder="e.g. Lunch"
                           required>

                </div>


                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select id="category"
                            th:field="*{category}"
                            required>

                        <option value="">
                            Select category
                        </option>

                        <option value="Food">
                            Food
                        </option>

                        <option value="Transport">
                            Transport
                        </option>

                        <option value="Shopping">
                            Shopping
                        </option>

                        <option value="Entertainment">
                            Entertainment
                        </option>

                        <option value="Bills">
                            Bills
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="expenseDate">
                        Date
                    </label>

                    <input id="expenseDate"
                           type="date"
                           th:field="*{expenseDate}"
                           required>

                </div>


                <div class="form-actions">

                    <button type="submit"
                            class="btn btn-primary">
                        Save Expense
                    </button>

                    <a href="/expenses"
                       class="btn btn-secondary">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </main>

</div>

</body>
</html>
