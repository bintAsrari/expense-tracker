<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Expense Tracker</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0"></script>
</head>

<body>

<div class="dashboard">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="sidebar-logo">
            👤
        </div>

        <h2>Welcome!</h2>

        <nav class="sidebar-menu">

            <a href="/dashboard">
                 Dashboard
            </a>

            <a href="/expenses" class="active">
                Transactions
            </a>

            <a href="/budgets">
                 Budgets
            </a>

            <a href="/reports">
                 Reports
            </a>

            <a href="/savings">
                Savings Goals
            </a>

        </nav>

    </aside>


    <!-- MAIN CONTENT -->
    <main class="main-content">

        <h1 class="page-title">
            My Expenses
        </h1>

        <div class="card">

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">

                <h2 class="card-title" style="margin: 0;">
                    Expense Transactions
                </h2>

                <a href="/expenses/new"
                   class="btn btn-primary">
                    + Add Expense
                </a>

            </div>


            <table class="expense-table">

                <thead>
                <tr>
                    <th>Date</th>
                    <th>Description</th>
                    <th>Category</th>
                    <th>Amount</th>
                    <th>Action</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="expense : ${expenses}">

                    <td th:text="${expense.expenseDate}">
                        2026-08-26
                    </td>

                    <td th:text="${expense.description}">
                        Lunch
                    </td>

                    <td>
                        <span class="category"
                              th:text="${expense.category}">
                            Food
                        </span>
                    </td>

                    <td class="amount">
                        $<span th:text="${expense.amount}">
                            10.50
                        </span>
                    </td>

                    <td>

                        <a th:href="@{/expenses/delete/{id}(id=${expense.id})}"
                           class="btn btn-danger">
                            Delete
                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

            <div class="card">
                <canvas id="myChart" style="width:100%;max-width:600px"></canvas>
            </div>



        </div>

    </main>

</div>

</body>
</html>
